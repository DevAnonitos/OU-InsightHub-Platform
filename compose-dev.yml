services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - 9090:9090
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
      - influxdb
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring
    restart: always

  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./infra/monitoring/influxdb:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=my_database
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin_password
    networks:
      - monitoring
    restart: unless-stopped
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  k6s:
    image: grafana/k6:latest
    container_name: k6s
    volumes:
      - ./infra/monitoring/k6:/k6
    entrypoint: ["k6", "run", "/k6/test.js"]
    network_mode: host
    restart: "no"

  # nginx:
  #   image: nginx/nginx:latest
  #   container_name: nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"

# To Config Volumn Data
volumes:
  prometheus-data:
  grafana_data:

networks:
  monitoring:
    driver: bridge