user nginx;
worker_processes auto;

events { 
  use epoll;
  multi_accept on;
};

http { 

  sendfile on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      text/xml
      application/xml
      application/xml+rss
      text/javascript;
};

upstream backend {
  server backend:4000;
  keepalive 32;
}

upstream frontend {
  server frontend:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name localhost;

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_cache STATIC;
  }

  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_cache STATIC;
  }

  error_page code 500 502 503 504  /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
};