services:
  client:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"] 
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./frontend:/app
      - client-node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    networks:
      - dev-network

  server:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"] 
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./backend:/app 
      - server-node_modules:/app/node_modules
    env_file:
      - ./backend/.env

volumes:
  client-node_modules:
  server-node_modules:

networks:
  dev-network:
    driver: bridge